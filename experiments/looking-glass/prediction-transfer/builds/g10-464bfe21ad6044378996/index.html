<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gate 10 — Predict an unseen view</title><link rel="stylesheet" href="/style.css"></head><body>
<header><h1>Predict an unseen view and transfer</h1><p id="provenance">Source-informed software instrument; no human session or learning outcome</p><p id="mode-label">Scripted software demonstration — no predictions or reveals</p></header>
<main><section class="controls" aria-label="Saved tour controls"><button id="play">Play</button><button id="pause">Pause</button><button id="previous">Previous checkpoint</button><button id="next">Next checkpoint</button><label>Checkpoint <select id="checkpoint"><option>0</option><option>4</option><option>8</option><option>12</option><option>16</option><option>20</option></select></label><button id="replay">Replay from start</button><button id="reopen">Reopen saved start</button><span id="clock">0.000 s / 20 s</span></section>
<section class="context"><p id="instructions"></p><p id="formula"></p><p><a href="http://127.0.0.1:44002/" target="_blank" rel="noopener noreferrer">Gate 9 historical run</a></p></section>
<section class="controls" aria-label="Local review controls"><button id="inspect">Inspect this case</button><label>Case <select id="case-select"></select></label><button id="practice-open">Open worked practice</button><button id="practice-close">Close worked practice</button><button id="hide-result">Hide result / inspect another case</button></section>
<section id="practice" hidden></section><section id="task"></section><section id="cards" class="cards" aria-label="Supplied observations"></section><section id="target" aria-label="Target query"></section><section id="response-controls" class="controls"><button id="start">Start software prediction</button><button id="new-attempt">New review attempt</button><div id="choices"></div><button id="commit">Commit answer</button><button id="skip">Skip answering</button><button id="reveal">Reveal result</button></section>
<section class="controls"><button id="retry" hidden>Retry same request</button><button id="export-ledger">Export redacted ledger</button><button id="export-events">Export local event log</button></section><pre id="export-output" aria-label="Export output"></pre><details><summary>Published snapshot inspector</summary><pre id="inspector"></pre></details><pre id="status" role="status"></pre></main><script type="module" src="/app.mjs"></script></body></html>
